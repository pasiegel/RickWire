# Builds every RickWire client. Push / PR: test + build, files under the run's "Artifacts".
# Tag vX.Y.Z (matching rickwire/__init__.py): also publishes a GitHub Release with the files attached.
# Tag vX.Y.Z-something (e.g. v0.2.8-beta.1): the same, marked as a pre-release. If
# packaging/release_notes/<tag>.md exists, it goes at the top of the release notes.
name: Build

on:
  push:
    branches: [main, mac-port]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    name: Windows (installer + portable zip)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements-windows.txt

      - name: Security tests
        shell: pwsh
        run: |
          .venv\Scripts\python tests\audit_provider_security.py
          if ($LASTEXITCODE) { throw "provider key audit failed" }
          .venv\Scripts\python tests\dev\t_remote.py
          if ($LASTEXITCODE) { throw "login / proxy tests failed" }
          .venv\Scripts\python tests\dev\t_phoneurl.py
          if ($LASTEXITCODE) { throw "phone address tests failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # only for the ffmpeg / Deno release lookups
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
          if ($LASTEXITCODE) { throw "build.ps1 failed" }
          if (-not (Get-ChildItem dist -Filter "RickWire-Setup-*.exe")) { throw "installer missing" }
          if (-not (Test-Path dist\RickWire-portable.zip)) { throw "portable zip missing" }

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\RickWire\RickWire.exe -ArgumentList "--help" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "RickWire.exe --help exited with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/RickWire-Setup-*.exe
            dist/RickWire-portable.zip
          if-no-files-found: error

  linux:
    name: Linux (portable tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: python packaging/make_linux_portable.py

      - name: Smoke test (unpack, install, import, --help)
        run: |
          mkdir -p "$RUNNER_TEMP/rw" && tar xzf dist/RickWire-linux-portable.tar.gz -C "$RUNNER_TEMP/rw"
          cd "$RUNNER_TEMP/rw/RickWire"
          test -x run.sh
          python -m venv venv
          venv/bin/pip install -q -r requirements.txt
          venv/bin/python -c "import rickwire.app, rickwire.server, rickwire.desktop, rickwire.associate, rickwire.tools; print('imports OK')"
          venv/bin/python run.py --help

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/RickWire-linux-portable.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (.dmg, Apple Silicon)
    runs-on: macos-latest   # arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build
        id: build
        run: bash packaging/mac/build_mac.sh

      # Each test runs even if an earlier one failed; failures are posted as annotations (tests/ci_report.py).
      - name: Security tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # the tests use 127.0.0.2 as the "proxy"; macOS only answers on 127.0.0.1 unless the alias is added
          sudo ifconfig lo0 alias 127.0.0.2 up
          R=".venv-mac/bin/python tests/ci_report.py"
          ok=0
          $R "provider key audit" .venv-mac/bin/python tests/audit_provider_security.py || ok=1
          $R "login / proxy tests" .venv-mac/bin/python tests/dev/t_remote.py || ok=1
          $R "phone address tests" .venv-mac/bin/python tests/dev/t_phoneurl.py || ok=1
          exit $ok

      - name: Keychain (save, read back, delete a dummy key)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .venv-mac/bin/python tests/ci_report.py "keychain" .venv-mac/bin/python tests/check_keychain.py

      - name: ffmpeg + Deno downloads (checksums, Apple Silicon signing)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # only for the release lookups (shared runner IPs hit rate limits)
        run: |
          R=".venv-mac/bin/python tests/ci_report.py"
          $R "tool downloads" .venv-mac/bin/python -m rickwire.tools install ffmpeg deno --dest "$RUNNER_TEMP/tools"
          $R "ffmpeg runs" "$RUNNER_TEMP/tools/ffmpeg" -version
          $R "ffprobe runs" "$RUNNER_TEMP/tools/ffprobe" -version
          $R "deno runs" "$RUNNER_TEMP/tools/deno" --version

      - name: Smoke test the app (start, window, menu bar, magnet + .torrent via Apple Events, quit)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .venv-mac/bin/python tests/ci_report.py "app smoke test" .venv-mac/bin/python tests/check_mac_app.py dist/RickWire.app --shot dist/mac-screenshot.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-test
          path: dist/mac-screenshot.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result != 'failure'
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        id: tag
        run: |
          v=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('rickwire/__init__.py').read())[1])")
          case "$GITHUB_REF_NAME" in
            "v$v")   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            "v$v"-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::tag $GITHUB_REF_NAME but rickwire/__init__.py says $v"; exit 1 ;;
          esac
          notes="packaging/release_notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then cp "$notes" "$RUNNER_TEMP/notes.md"; else : > "$RUNNER_TEMP/notes.md"; fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: RickWire ${{ github.ref_name }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg

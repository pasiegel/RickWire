<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <title>Sign in · RickWire</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main style="max-width:440px;padding-top:8vh">
    <section class="card add" style="padding:24px;gap:16px;text-align:center">
      <div class="portal" style="width:90px;height:90px;margin:0 auto"></div>
      <div class="brand" style="align-items:center"><h1>Rick<span>Wire</span></h1></div>

      <div id="pairBox" class="hidden" style="display:grid;gap:12px">
        <div class="hint">On your PC: RickWire › 📱 Pair phone. Then enter the 6-digit code.</div>
        <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"
               style="text-align:center;font-size:30px;letter-spacing:10px;font-weight:800">
        <input type="text" id="name" placeholder="Name this phone (e.g. My Pixel)" maxlength="40">
        <button class="btn go" id="go" style="justify-content:center;padding:12px">Pair it, Morty</button>
      </div>

      <div id="orLine" class="hint hidden">— or sign in —</div>

      <form id="loginBox" class="hidden" style="display:grid;gap:12px" autocomplete="on">
        <input type="text" id="user" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <input type="password" id="pass" placeholder="Password" autocomplete="current-password" required>
        <input type="text" id="otp" class="hidden" inputmode="numeric" autocomplete="one-time-code" maxlength="7"
               placeholder="2FA code" style="text-align:center;font-size:24px;letter-spacing:6px;font-weight:800">
        <button class="btn go" type="submit" id="signIn" style="justify-content:center;padding:12px">Sign in</button>
      </form>

      <div class="hint" id="msg"></div>
    </section>
  </main>
  <script src="/pair.js"></script>
</body>
</html>
